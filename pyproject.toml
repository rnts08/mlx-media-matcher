[project]
name = "mlx-media-match"
version = "0.1.0"
description = "Analyze image folders with a local MLX vision model: find people/objects and group duplicates across resolutions."
requires-python = ">=3.11"
dependencies = [
    "mlx-vlm>=0.7.0",
    "numpy>=2.0",
    "pillow>=10.0",
    "pillow-heif>=0.16",
    "regex>=2024.0",
]

[project.scripts]
media-match = "media_match.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["media_match"]
