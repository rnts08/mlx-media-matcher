[project]
name = "mlx-media-match"
version = "0.2.26"
description = "Analyze image folders with a local MLX vision model: find people/objects and group duplicates across resolutions."
authors = [{ name = "Timh Bergström" }]
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "mlx-vlm>=0.7.0",
    "numpy>=2.0",
    "pillow>=10.0",
    "pillow-heif>=0.16",
    "regex>=2024.0",
    "send2trash>=2.0",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
media-match = "media_match.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["media_match"]
